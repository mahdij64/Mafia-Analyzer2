        '<button class="btn sm ghost" data-act="votes-clear">🗑 پاک کردن رأی‌های «' + stageTitle(stage) + '»</button>' +
        '</div>');
    }
    H.push('</div>');
    return H.join('');
  }
});

/* ---------- اکشن‌های میز بازی ---------- */
Object.assign(Actions, {
  'stage-set'(i){
    const g = activeGame();
    if(setStage(g.id, i)){ UI.selSource = null; UI.pendingTargets = null; UI.render(); }
  },
  'advance-stage'(){
    const g = activeGame();
    UI.confirmSheet('پایان مرحله', 'پرونده «' + stageTitle(g.currentStageIndex) + '» بسته و مرحله بعد باز شود؟ تارگت‌ها و داده‌های ثبت‌شده حفظ می‌شوند.', 'بستن پرونده و رفتن به مرحله بعد ◄', () => {
      advanceStage(g.id);
      UI.selSource = null; UI.pendingTargets = null;
      UI.closeSheet(); UI.render();
    });
  },
  'seat'(id){
    const g = activeGame();
    if(UI.selSource == null){
      UI.selSource = id;
      UI.pendingTargets = new Set(targetsOf(g.id).filter(t => t.stageIndex === g.currentStageIndex && t.sourceId === id).map(t => t.targetId));
      UI.render();
    } else if(UI.selSource === id){
      UI.selSource = null; UI.pendingTargets = null; UI.render();
    } else {
      if(UI.pendingTargets.has(id)) UI.pendingTargets.delete(id);
      else UI.pendingTargets.add(id);
      UI.render();
    }
  },
  'sel-save'(){
    const g = activeGame();
    if(UI.selSource == null) return;
    replaceTargets(g.id, g.currentStageIndex, UI.selSource, Array.from(UI.pendingTargets || []));
    const cnt = UI.pendingTargets ? UI.pendingTargets.size : 0;
    UI.selSource = null; UI.pendingTargets = null;
    UI.render();
    UI.toast('✓ ' + faNum(cnt) + ' تارگت برای «' + stageTitle(g.currentStageIndex) + '» ثبت شد');
  },
  'sel-clear'(){
    const g = activeGame();
    if(UI.selSource != null) replaceTargets(g.id, g.currentStageIndex, UI.selSource, []);
    UI.selSource = null; UI.pendingTargets = null; UI.render();
    UI.toast('تارگت‌های این بازیکن در این مرحله پاک شد');
  },
  'add-player'(){
    const g = activeGame();
    UI.promptSheet('بازیکن جدید', 'نام بازیکن', '', 'افزودن', (val) => {
      if(addPlayer(g.id, val)){ UI.closeSheet(); UI.render(); UI.toast('بازیکن «' + val.trim() + '» اضافه شد'); }
    });
  },

  /* ---------- رأی‌گیری ---------- */
  'vote-stage'(i){ UI.voteStage = i; UI.render(); },
  'vote-sel'(id, el){
    const g = activeGame();
    const stage = Math.min(UI.voteStage == null ? g.currentStageIndex : UI.voteStage, g.maxUnlockedStageIndex);
    const val = el.value === '' ? null : Number(el.value);
    if(val == null){ db.votes = db.votes.filter(v => !(v.gameId === g.id && v.stageIndex === stage && v.voterId === id)); touchGame(g.id); persist(); }
    else setVote(g.id, stage, id, val);
    UI.render();
  },
  'votes-clear'(){
    const g = activeGame();
    const stage = Math.min(UI.voteStage == null ? g.currentStageIndex : UI.voteStage, g.maxUnlockedStageIndex);
    UI.confirmSheet('پاک کردن رأی‌ها', 'همه رأی‌های «' + stageTitle(stage) + '» حذف شوند؟', 'پاک کن', () => {
      clearStageVotes(g.id, stage); UI.closeSheet(); UI.render(); UI.toast('رأی‌های این مرحله پاک شد');
    }, true);
  }
});

Object.assign(Actions, {
  'sheet-ok'(){
    if(UI._promptOk){
      const inp = document.getElementById(UI._promptId);
      const v = inp ? inp.value : '';
      if(!String(v).trim()){ UI.toast('لطفاً مقدار را وارد کنید'); return; }
      const cb = UI._promptOk; UI._promptOk = null; cb(v);
    } else if(UI._confirmOk){
      const cb = UI._confirmOk; UI._confirmOk = null; cb();
    } else UI.closeSheet();
  },
  'sheet-cancel'(){ UI._promptOk = null; UI._confirmOk = null; UI.closeSheet(); },

  'open-player'(pid){
    const g = activeGame(); if(!g) return;
    const p = db.players.find(x => x.id === pid); if(!p) return;
    UI._sheetPlayer = pid;
    const s = Core.analyzePlayer(g.id, pid, g.currentStageIndex);
    const pNotes = notesOf(g.id).filter(n => n.playerId === pid).sort((a, b) => b.ts - a.ts);
    const secrets = db.secretNotes.filter(x => x.playerId === pid).sort((a, b) => b.ts - a.ts);
    const players = playersOf(g.id);

function legacyCopy(txt){
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(() => true).catch(() => legacyCopy(txt));
  return Promise.resolve(legacyCopy(txt));
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function scrollChat(){
  setTimeout(() => { const cb = document.getElementById('chat-box'); if(cb) cb.scrollTop = cb.scrollHeight; }, 60);
}
function httpHint(status, msg){
  if(status === 401) return 'کلید API نامعتبر یا رد شد (۴۰۱). کلید را بررسی کنید.';
  if(status === 403) return 'دسترسی ممنوع (۴۰۳). احتمالاً کلید محدود شده یا سرویس‌دهنده اجازه درخواست از مرورگر (CORS) را نمی‌دهد.';
  if(status === 404) return 'آدرس یا نام مدل پیدا نشد (۴۰۴). Base URL و مدل را بررسی کنید.';
  if(status === 429) return 'محدودیت نرخ درخواست (۴۲۹). کمی صبر کنید و دوباره امتحان کنید.';
  if(status >= 500) return 'خطای سمت سرور (' + status + '). سرویس موقتاً در دسترس نیست.';
  return msg ? String(msg) : 'خطای HTTP ' + status;
}
async function callChat(messages){
  const base = String(db.ai.baseUrl || '').replace(/\/+$/, '');
  if(!base) throw new Error('Base URL تنظیم نشده است.');
  let res;
  try{
    res = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + db.ai.apiKey },
      body: JSON.stringify({ model: db.ai.model, messages, temperature: Number(db.ai.temperature) || 0.4, stream: false })
    });
  }catch(e){
    throw new Error('اتصال برقرار نشد — اینترنت یا CORS را بررسی کنید. بقیه برنامه کاملاً آفلاین کار می‌کند؛ فعلاً از «تحلیل محلی» استفاده کنید. (' + e.message + ')');
  }
  if(!res.ok){
    let msg = '';
    try{ const j = await res.json(); msg = (j.error && (j.error.message || j.error)) || j.message || ''; }catch(e){}
    throw new Error(httpHint(res.status, msg));
  }
  const j = await res.json();
  const content = j.choices && j.choices[0] ? ((j.choices[0].message && j.choices[0].message.content) || j.choices[0].text) : null;
  if(content == null || !String(content).trim()) throw new Error('پاسخ خالی از سرور دریافت شد.');
  return String(content);
}

    if(navigator.share){
      navigator.share({ text: txt }).catch(() => { copyText(txt).then(ok => UI.toast(ok ? 'گزارش کپی شد (اشتراک لغو شد)' : 'کپی ناموفق بود')); });

  },
  'local-analyze'(){

    const g = activeGame();

      '<datalist id="model-list">' + this.models.map(m => '<option value="' + esc(m) + '"></option>').join('') + '</datalist>' +
      '<div class="btn-row" style="margin-top:8px">' +
      '<button class="btn sm ghost" data-act="ai-models"' + (this.modelsLoading ? ' disabled' : '') + '>' + (this.modelsLoading ? '<span class="spin"></span> در حال دریافت…' : '🔄 دریافت لیست مدل‌ها') + '</button>' +
      (this.models.length ? '<span class="tiny" style="align-self:center">' + faNum(this.models.length) + ' مدل دریافت شد — روی فیلد مدل بزنید تا لیست باز شود</span>' : '') +
      '</div>' +
      '<label class="fl">دمای پاسخ: <b id="temp-val">' + ai.temperature + '</b></label>' +
      '<input type="range" min="0" max="1" step="0.05" value="' + ai.temperature + '" data-inp="temp-live">' +
      '<button class="btn block crimson" style="margin-top:12px" data-act="ai-save">ذخیره تنظیمات AI ✓</button></div>');
    const bubbles = this.chat.map(m => '<div class="bubble ' + (m.role === 'user' ? 'me' : m.role === 'err' ? 'err' : 'ai') + '">' + esc(m.content) + '</div>').join('');
    H.push('<div class="card"><h3 class="green">💬 چت تست</h3>' +
      '<div class="sub">برای اطمینان از اتصال، یک پیام بفرستید</div>' +
      '<div id="chat-box">' + (bubbles || '<div class="tiny" style="text-align:center;padding:10px">هنوز پیامی رد و بدل نشده</div>') +
      (this.aiBusy === 'chat' ? '<div class="bubble typing"><span class="spin"></span> در حال تایپ…</div>' : '') + '</div>' +
      '<div class="btn-row" style="gap:6px">' +
      '<input type="text" id="chat-in" placeholder="مثلاً: سلام، آماده‌ای؟" style="flex:3">' +
      '<button class="btn crimson" style="flex:1" data-act="chat-send"' + (this.aiBusy ? ' disabled' : '') + '>ارسال ⇐</button></div></div>');
    return H.join('');
  },

  settingsData(){
    const H = [];
    H.push('<div class="card"><h3>💾 داده‌ها و پشتیبان</h3>' +
      '<div class="sub">همه داده‌ها فقط روی همین گوشی (localStorage) ذخیره می‌شوند — هیچ سروری در کار نیست.</div>' +
      '<div class="kv"><span>بازی‌ها</span><b>' + faNum(db.games.length) + '</b></div>' +
      '<div class="kv"><span>بازیکنان</span><b>' + faNum(db.players.length) + '</b></div>' +
      '<div class="kv"><span>یادداشت‌ها</span><b>' + faNum(db.notes.length) + '</b></div>' +
      '<div class="kv"><span>تارگت‌ها</span><b>' + faNum(db.targets.length) + '</b></div>' +
      '<div class="kv"><span>رأی‌ها</span><b>' + faNum(db.votes.length) + '</b></div>' +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn ghost" data-act="export-json">📤 پشتیبان JSON</button>' +
      '<button class="btn ghost" data-act="import-pick">📥 بازیابی پشتیبان</button>' +
      '</div>' +
      '<input type="file" id="import-file" data-act="import-file" accept=".json,application/json" style="display:none">' +
      '<hr class="sep">' +
      '<div style="font-weight:800;color:var(--gold);font-size:13px;margin-bottom:4px">📱 نسخه آفلاین برای گوشی</div>' +
      '<div class="sub" style="margin-bottom:8px">با این دکمه، کل برنامه به صورت یک فایل HTML مستقل دانلود می‌شود. آن فایل را روی گوشی باز کنید — بدون اینترنت و بدون نصب، همه‌چیز کار می‌کند و داده‌هایتان هم روی خود گوشی می‌ماند.</div>' +
      '<button class="btn block gold" data-act="download-html">⬇️ دانلود فایل HTML آفلاین برنامه</button>' +
      '<hr class="sep">' +
      '<button class="btn block crimson-d" data-act="wipe-all">🗑 پاک کردن همه داده‌ها</button>' +
      '</div>');
    return H.join('');
  }
});

Object.assign(Actions, {
  'set-section'(id, el){ UI.section = el.getAttribute('data-sec'); UI.render(); },
  'select-game'(gid){
    selectGame(gid);
    const g = db.games.find(x => x.id === gid);
    UI.voteStage = g.currentStageIndex;
    UI.reportStage = g.currentStageIndex;
    UI.render();
    UI.toast('بازی «' + g.name + '» فعال شد 🎮');
  },
  'game-open-manage'(gid){ selectGame(gid); UI.render(); Actions['manage-game'](); },
  'game-del-list'(gid){
    const g = db.games.find(x => x.id === gid); if(!g) return;
    UI.confirmSheet('حذف بازی', 'بازی «' + esc(g.name) + '» با همه داده‌هایش برای همیشه حذف شود؟', 'حذف کن', () => {
      deleteGame(gid); UI.closeSheet(); UI.render(); UI.toast('بازی حذف شد');
    }, true);
  },

  /* --- ضرایب --- */
  'weight-live'(id, el){
    const k = el.getAttribute('data-key');
    UI.weightsDraft[k] = Number(el.value) / 100;
    const lbl = document.getElementById('wv-' + k);
    if(lbl) lbl.textContent = faNum(el.value) + '٪';
  },
  'weights-save'(){
    const g = activeGame(); if(!g || !UI.weightsDraft) return;
    saveWeights(g.id, UI.weightsDraft);
    UI.toast('ضرایب ذخیره شد و تحلیل‌ها به‌روز شدند ⚖️');
    UI.render();
  },
  'weights-reset'(){
    const g = activeGame(); if(!g) return;
    UI.weightsDraft = Object.assign({}, DEFAULT_WEIGHTS);
    saveWeights(g.id, UI.weightsDraft);
    UI.toast('ضرایب به حالت پیش‌فرض برگشت');
    UI.render();
  },

  /* --- هوش مصنوعی --- */
  'ai-save'(){
    const b = document.getElementById('ai-base'), k = document.getElementById('ai-key'), m = document.getElementById('ai-model');
    db.ai.baseUrl = (b.value || '').trim() || DEFAULT_AI_BASE_URL;
    db.ai.apiKey = (k.value || '').trim();
    db.ai.model = (m.value || '').trim();
    persist();
    UI.toast('تنظیمات AI ذخیره شد ✓');
  },
  async 'ai-models'(){
    if(UI.modelsLoading) return;
    const b = document.getElementById('ai-base'), k = document.getElementById('ai-key');
    if(b && k){ db.ai.baseUrl = (b.value || '').trim(); db.ai.apiKey = (k.value || '').trim(); persist(); }
    const base = String(db.ai.baseUrl || '').replace(/\/+$/, '');
    if(!base || !db.ai.apiKey){ UI.toast('ابتدا Base URL و کلید API را وارد کنید'); return; }
    UI.modelsLoading = true; UI.render();
    try{
      let res;
      try{
        res = await fetch(base + '/models', { headers: { 'Authorization': 'Bearer ' + db.ai.apiKey } });
      }catch(e){
        throw new Error('اتصال برقرار نشد — اینترنت یا CORS را بررسی کنید. (' + e.message + ')');
      }
      if(!res.ok) throw new Error(httpHint(res.status));
      const j = await res.json();
      let list = [];
      if(Array.isArray(j)) list = j;
      else if(j && Array.isArray(j.data)) list = j.data;
      else if(j && j.id) list = [j];
      UI.models = list.map(m => typeof m === 'string' ? m : (m.id || m.name)).filter(Boolean);
      if(UI.models.length) UI.toast('✓ ' + faNum(UI.models.length) + ' مدل دریافت شد — روی فیلد «مدل» بزنید و از لیست انتخاب کنید');
      else UI.toast('سرور پاسخی داد ولی لیست مدل خالی بود');
    }catch(e){
      UI.toast('⚠️ دریافت مدل‌ها ناموفق: ' + e.message);
    }
    UI.modelsLoading = false; UI.render();
  },
  async 'chat-send'(){
    const inp = document.getElementById('chat-in');
    const txt = inp ? String(inp.value).trim() : '';
    if(!txt){ UI.toast('پیامی بنویسید'); return; }
    if(UI.aiBusy) return;
    if(!db.ai.apiKey || !db.ai.model){
      UI.chat.push({ role: 'err', content: '⚙️ ابتدا Base URL، کلید API و مدل را وارد و ذخیره کنید.' });
      UI.render(); scrollChat(); return;
    }
    UI.chat.push({ role: 'user', content: txt });
    UI.aiBusy = 'chat'; UI.render(); scrollChat();
    try{
      const msgs = [{ role: 'system', content: 'تو دستیار تحلیل بازی مافیا هستی. به فارسی روان و کوتاه پاسخ بده.' }];
      UI.chat.forEach(m => { if(m.role === 'user' || m.role === 'assistant') msgs.push({ role: m.role, content: m.content }); });
      const reply = await callChat(msgs);
      UI.chat.push({ role: 'assistant', content: reply });
    }catch(e){
      UI.chat.push({ role: 'err', content: '❌ ' + e.message });
    }
    UI.aiBusy = null; UI.render(); scrollChat();
  },
  'temp-live'(id, el){
    const lbl = document.getElementById('temp-val');
    if(lbl) lbl.textContent = el.value;
  },

  /* --- داده‌ها --- */
  'export-json'(){
    const name = 'mafia-analyzer-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    downloadFile(name, JSON.stringify(db, null, 2), 'application/json');
    UI.toast('فایل پشتیبان دانلود شد 💾');
  },
  'import-pick'(){
    const f = document.getElementById('import-file');
    if(f) f.click(); else UI.toast('ورودی فایل در دسترس نیست');
  },
  'import-file'(id, el){
    const file = el.files && el.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(String(r.result));
        if(!data || !Array.isArray(data.games) || !Array.isArray(data.players)) throw new Error('invalid');
        db = data;
        if(!db.weights) db.weights = {};
        if(!db.ai) db.ai = freshDb().ai;
        if(db.activeGameId == null || !db.games.some(x => x.id === db.activeGameId)){
          const rest = sortedGames();
          db.activeGameId = rest.length ? rest[0].id : null;
        }
        persist();
        UI.selSource = null; UI.pendingTargets = null;
        UI.toast('پشتیبان با موفقیت بازیابی شد ✓');
        UI.go('settings', 'games');
      }catch(e){
        UI.toast('فایل پشتیبان معتبر نیست ❌');
      }
    };
    r.readAsText(file);
  },
  'download-html'(){
    UI.closeSheet();
    setTimeout(() => {
      const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      downloadFile('تحلیل‌گر-مافیا-آفلاین.html', html, 'text/html;charset=utf-8');
      UI.toast('فایل آفلاین دانلود شد — آن را روی گوشی باز کنید 📱');
    }, 350);
  },
  'wipe-all'(){
    UI.confirmSheet('پاک کردن همه داده‌ها', 'همه بازی‌ها، بازیکنان، یادداشت‌ها، رأی‌ها و تنظیمات برای همیشه از این گوشی حذف شوند؟ این عمل قابل بازگشت نیست!', 'همه‌چیز را پاک کن', () => {
      wipeAll(); UI.closeSheet(); UI.go('table'); UI.toast('همه داده‌ها پاک شد');
    }, true);
  }
});

/* ============================================================
   راه‌اندازی برنامه
   ============================================================ */
initDb();
(function(){
  if(!activeGame()){
    const rest = sortedGames();
    if(rest.length) db.activeGameId = rest[0].id;
  }
  const g = activeGame();
  UI.reportStage = g ? g.currentStageIndex : 0;
  UI.voteStage = g ? g.currentStageIndex : 0;
  UI.render();
})();
</script>
